# Weekly update PRs. Each one is reviewed individually (CLAUDE.md: no blind upgrades).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      dotnet-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm # Dependabot's name for the JS ecosystem; it reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    commit-message:
      prefix: chore
    groups:
      js-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
